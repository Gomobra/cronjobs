name: LuckyWatch

on:
  workflow_dispatch:

concurrency:
  group: luckywatch-claim
  cancel-in-progress: true

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run bot
        run: python bot.py
